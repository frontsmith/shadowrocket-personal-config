name: Build Shadowrocket Config

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    # Every day 08:20 China Standard Time (00:20 UTC)
    - cron: "20 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "shadowrocket-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run offline source checks
        run: python -m unittest discover -s tests -v
      - name: Build and validate config
        run: python build.py
      - name: Confirm deployed file exists
        run: test -s public/Front_Shadowrocket_personal.conf
      - name: Keep successful build as workflow artifact (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: shadowrocket-config
          path: public/Front_Shadowrocket_personal.conf
          retention-days: 30
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
