# ==============================
# 1. Auto proxy: A VPS strictly preferred, then B long USA/Japan.
# Keep the group name distinct from Shadowrocket's built-in PROXY policy.
# ==============================
AutoProxy = fallback,A-主用-vl-reality,A-备用-vm-argo,A-备用-vm-ws,A-备用-anytls,B-备用-long,url=http://www.gstatic.com/generate_204,interval=300,timeout=5

# ==============================
# 2. Primary subscription: VPS-US
# Node names MUST match the regex exactly.
# ==============================
A-主用-vl-reality = fallback,VPS-US,use=true,policy-regex-filter=^vl-reality-Front-VPS\.US$,url=http://www.gstatic.com/generate_204,interval=300,timeout=5
A-备用-vm-argo = fallback,VPS-US,use=true,policy-regex-filter=^vm-argo-Front-VPS\.US$,url=http://www.gstatic.com/generate_204,interval=300,timeout=5
A-备用-vm-ws = fallback,VPS-US,use=true,policy-regex-filter=^vm-ws-Front-VPS\.US$,url=http://www.gstatic.com/generate_204,interval=300,timeout=5
A-备用-anytls = fallback,VPS-US,use=true,policy-regex-filter=^anytls-Front-VPS\.US$,url=http://www.gstatic.com/generate_204,interval=300,timeout=5
A-手动选择 = select,VPS-US,use=true,policy-regex-filter=Front-VPS\.US

# ==============================
# 3. Secondary subscription: long; USA before Japan.
# ==============================
B-美国 = url-test,long,use=true,policy-regex-filter=美国,url=http://www.gstatic.com/generate_204,interval=300,tolerance=50,timeout=5
B-日本 = url-test,long,use=true,policy-regex-filter=日本,url=http://www.gstatic.com/generate_204,interval=300,tolerance=50,timeout=5
B-备用-long = fallback,B-美国,B-日本,url=http://www.gstatic.com/generate_204,interval=300,timeout=5
B-手动选择 = select,long,use=true,policy-regex-filter=美国|日本

# ==============================
# 4. Overseas services: AutoProxy by default; manual override possible.
# ==============================
AI = select,AutoProxy,B-备用-long,B-美国,B-日本,B-手动选择,A-手动选择,DIRECT,policy-select-name=AutoProxy
YouTube = select,AutoProxy,B-备用-long,B-美国,B-日本,B-手动选择,A-手动选择,DIRECT,policy-select-name=AutoProxy
Telegram = select,AutoProxy,B-备用-long,B-美国,B-日本,B-手动选择,A-手动选择,DIRECT,policy-select-name=AutoProxy
GitHub = select,AutoProxy,B-备用-long,B-美国,B-日本,B-手动选择,A-手动选择,DIRECT,policy-select-name=AutoProxy
Google = select,AutoProxy,B-备用-long,B-美国,B-日本,B-手动选择,A-手动选择,DIRECT,policy-select-name=AutoProxy
Twitter = select,AutoProxy,B-备用-long,B-美国,B-日本,B-手动选择,A-手动选择,DIRECT,policy-select-name=AutoProxy
GlobalMedia = select,AutoProxy,B-备用-long,B-美国,B-日本,B-手动选择,A-手动选择,DIRECT,policy-select-name=AutoProxy

# ==============================
# 5. DIRECT by default, but manual proxy switching available.
# ==============================
Apple = select,DIRECT,AutoProxy,B-备用-long,B-手动选择,policy-select-name=DIRECT
Microsoft = select,DIRECT,AutoProxy,B-备用-long,B-手动选择,policy-select-name=DIRECT
NAS服务 = select,DIRECT,AutoProxy,B-备用-long,B-手动选择,policy-select-name=DIRECT
Domestic = select,DIRECT,AutoProxy,policy-select-name=DIRECT
LAN = select,DIRECT,policy-select-name=DIRECT

# ==============================
# 6. Final fallback policy
# ==============================
Final = select,AutoProxy,DIRECT,B-备用-long,B-手动选择,A-手动选择,policy-select-name=AutoProxy
