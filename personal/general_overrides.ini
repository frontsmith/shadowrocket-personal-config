# Personal Shadowrocket General overrides (v2.0)
# Tailscale 100.64/10 must remain owned by TUN / TAILSCALE rules.
skip-proxy = 192.168.0.0/16,10.0.0.0/8,100.64.0.0/10,172.16.0.0/12,localhost,*.local,captive.apple.com,*.ccb.com,*.abchina.com.cn,*.psbc.com,www.baidu.com,www.163.com

# Do NOT add 100.64.0.0/10 to tun-excluded-routes.
tun-excluded-routes = 10.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, 239.255.255.250/32, ff02::fb/128

# Prefer current Wi-Fi/cellular network DNS for direct domains.
dns-direct-system = true
# Do not silently retry direct DNS resolution through a proxy.
dns-direct-fallback-proxy = false

# Keep IPv6 as in current upstream; investigate it separately if needed.
ipv6 = true
prefer-ipv6 = false

# Do not interfere with QUIC for DIRECT traffic.
block-quic = all-proxy
# No update-url: Pages hosts the built config, not the upstream config.
